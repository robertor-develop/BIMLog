<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lens Next exact-390 acceptance</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #dfe6eb; }
      body { display: grid; place-items: start center; padding: 12px; box-sizing: border-box; }
      iframe { width: 390px; height: 844px; border: 0; background: white; box-shadow: 0 8px 28px rgb(20 36 48 / 18%); }
    </style>
  </head>
  <body>
    <iframe title="Lens Next exact-390 production component" src="/lens-next-acceptance-harness.html?acceptanceMobile=390"></iframe>
    <pre id="acceptance-report" aria-live="polite">Waiting for exact-390 component report…</pre>
    <script>
      const imageScenario = new URLSearchParams(location.search).get("imageScenario");
      if (imageScenario === "broken") document.querySelector("iframe").src += "&imageScenario=broken";
      addEventListener("message", event => {
        if (event.origin !== location.origin || event.data?.type !== "lens-next-mobile-acceptance") return;
        document.getElementById("acceptance-report").textContent = JSON.stringify(event.data.metrics);
      });
    </script>
  </body>
</html>
